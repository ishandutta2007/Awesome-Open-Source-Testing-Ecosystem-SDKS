<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .orbit-circle { fill: none; stroke-dasharray: 4 6; stroke-opacity: 0.25; }
      .pulsing-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .floating-pill {
        animation: float 6s ease-in-out infinite alternate;
      }
      .floating-pill-rev {
        animation: floatRev 7s ease-in-out infinite alternate;
      }
      .dash-beam {
        stroke-dasharray: 8 16;
        animation: dashMove 15s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.5; }
        100% { transform: scale(1.04); opacity: 0.9; }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatRev {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Ambient Glow Orbs in Background -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="180" r="170" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="120" fill="#059669" opacity="0.08" filter="url(#glow)"/>

  <!-- Tech Grid Background -->
  <g class="bg-grid">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360"/>
  </g>

  <!-- Dynamic Animated Circuit/Orbit Paths (Behind Text) -->
  <g class="dash-beam" stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <path d="M 60 180 Q 300 40 600 180 T 1140 180" fill="none"/>
    <path d="M 60 220 Q 300 340 600 200 T 1140 220" fill="none"/>
  </g>

  <!-- Dynamic Floating Decorative Pills in Background Edges -->
  <!-- Left Side Dynamic Pills -->
  <g class="floating-pill">
    <g transform="translate(70, 70)">
      <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8"/>
      <text x="32" y="20" fill="#94a3b8" class="tag-text">E2E AUTOMATION</text>
    </g>
    <g transform="translate(50, 260)">
      <rect width="125" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.75"/>
      <circle cx="18" cy="16" r="5" fill="#34d399"/>
      <text x="32" y="20" fill="#94a3b8" class="tag-text">CROSS-BROWSER</text>
    </g>
  </g>

  <!-- Right Side Dynamic Pills -->
  <g class="floating-pill-rev">
    <g transform="translate(1000, 70)">
      <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.75"/>
      <circle cx="18" cy="16" r="5" fill="#a855f7"/>
      <text x="32" y="20" fill="#94a3b8" class="tag-text">PERFORMANCE / k6</text>
    </g>
    <g transform="translate(1020, 260)">
      <rect width="115" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.75"/>
      <circle cx="18" cy="16" r="5" fill="#f59e0b"/>
      <text x="32" y="20" fill="#94a3b8" class="tag-text">MOBILE APPIUM</text>
    </g>
  </g>

  <!-- Pulsing Orbit Nodes in Background Edges -->
  <g class="pulsing-node">
    <circle cx="160" cy="170" r="28" fill="url(#cyan-glow)"/>
    <circle cx="160" cy="170" r="6" fill="#38bdf8"/>
    <circle cx="1040" cy="170" r="28" fill="url(#violet-glow)"/>
    <circle cx="1040" cy="170" r="6" fill="#c084fc"/>
  </g>

  <!-- Top Badge / Pill in Header -->
  <g transform="translate(475, 42)">
    <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="16" cy="14" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#38bdf8" class="tag-text" font-weight="700">CURATED QA &amp; TEST ECOSYSTEM</text>
  </g>

  <!-- Main Foreground Content (Centered & Completely Unobscured) -->
  <!-- Title -->
  <text x="600" y="135" text-anchor="middle" class="title-text" font-size="38" fill="url(#text-grad)">
    Awesome Open-Source Testing Ecosystem &amp; SDKs
  </text>

  <!-- Subtitle -->
  <text x="600" y="178" text-anchor="middle" class="subtitle-text" font-size="16" fill="#94a3b8">
    Production-grade frameworks, automated test runners, load engines &amp; cloud grids
  </text>

  <!-- Tech Category Pills Row (Static, Centered Foreground) -->
  <g transform="translate(230, 215)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="65" y="21" text-anchor="middle" fill="#e2e8f0" class="tag-text">🎭 Playwright</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(145, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="65" y="21" text-anchor="middle" fill="#e2e8f0" class="tag-text">⚡ Vitest &amp; Jest</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(290, 0)">
      <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="70" y="21" text-anchor="middle" fill="#e2e8f0" class="tag-text">🌐 Selenium &amp; WDIO</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(445, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
      <text x="65" y="21" text-anchor="middle" fill="#e2e8f0" class="tag-text">🌲 Cypress</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(590, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="72" y="21" text-anchor="middle" fill="#e2e8f0" class="tag-text">🚀 k6 &amp; JMeter</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <text x="600" y="295" text-anchor="middle" class="subtitle-text" font-size="13" fill="#64748b">
    Web E2E • Component &amp; Unit • Native Mobile • API Validation • Distributed Performance
  </text>
</svg>